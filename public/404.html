<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Dra. Vânia Medeiros | Harmonização Facial</title>
    <script>
      // Single Page Apps redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        var repo = segments.length > 0 ? segments[0] : '';
        var route = segments.slice(1).join('/');
        var search = window.location.search || '';
        
        var target = '/' + repo + '/#' + (route ? '/' + route + '/' : '/') + search;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 2rem; color: #6b5d50;">Carregando...</p>
  </body>
</html>
