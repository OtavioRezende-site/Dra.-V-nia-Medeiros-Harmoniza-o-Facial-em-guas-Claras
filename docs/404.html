<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Dra. Vânia Medeiros | Harmonização Facial</title>
    <script>
      // Single Page Apps redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var host = window.location.hostname;
        var segments = path.split('/').filter(Boolean);
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        var knownRoutes = [
          'sobre',
          'tratamentos',
          'experiencia-de-atendimento',
          'perguntas-frequentes',
          'contato',
          'privacidade',
          'resultados'
        ];

        // Check if on username.github.io/repo-name
        var isGithubProjectSite = host.endsWith('github.io') && segments.length > 0 && knownRoutes.indexOf(segments[0]) === -1 && segments[0] !== 'docs';
        
        var repo = isGithubProjectSite ? '/' + segments[0] : '';
        var routeSegments = isGithubProjectSite ? segments.slice(1) : segments;
        if (routeSegments.length > 0 && routeSegments[0] === 'docs') {
          routeSegments = routeSegments.slice(1);
        }
        var route = routeSegments.join('/');

        var cleanRoute = route ? '/' + route.replace(/^\/+|\/+$/g, '') + '/' : '/';
        var target = (repo ? repo : '') + '/#' + cleanRoute + search + hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 2rem; color: #6b5d50;">Carregando...</p>
  </body>
</html>
